name: Release Unity Package

on:
  - push

jobs:
  prebuild:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{steps.package_name.outputs.package_name}}
    steps:
      - id: package_name
        run: echo "package_name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

  release:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install dependencies
        run: node --version && npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release tooling without side effects
        run: node .github/scripts/release-tooling-smoke.mjs . space

      - run: |
          find Assets -name \*.meta > metaList
          mkdir dist
          cat metaList
      - uses: pCYSl5EDgo/create-unitypackage@master
        with:
          package-path: 'dist/${{needs.prebuild.outputs.package_name}}.unitypackage'
          include-files: metaList

      - name: Release
        if: ${{ !startsWith(github.ref, 'refs/heads/codex/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
